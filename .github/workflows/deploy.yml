
name: Deploy to STRATO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Deploy
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
          STRATO_KNOWN_HOSTS: ${{ secrets.STRATO_KNOWN_HOSTS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          mkdir -p ~/.ssh
          printf '%s\n' "$STRATO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host %s\n  StrictHostKeyChecking yes\n' "$STRATO_HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          lftp -u "$STRATO_USER","$STRATO_PASSWORD" \
            "sftp://$STRATO_HOST:22" -e '
              set cmd:fail-exit true
              mirror --reverse --no-perms dist .
              put dist/.htaccess -o .htaccess
              bye
            '
